<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Clinic</title>
  <link rel="stylesheet" href="/static/style.css?v=17">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="/client/dashboard" class="brand-link">
      <span class="sprig" aria-hidden="true">
      <svg viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="1.3"
           stroke-linecap="round">
        <path d="M10 23V7"/>
        <path d="M10 13c0-3.6 2.4-6.4 6-7-.3 3.8-2.6 6.4-6 7z" fill="currentColor"
              fill-opacity=".16"/>
        <path d="M10 9.5C10 6 7.8 3.3 4.3 2.5 4.6 6.2 6.7 8.8 10 9.5z"
              fill="currentColor" fill-opacity=".1"/>
      </svg>
      </span>
      <span class="brand"><b>Clinic</b><span class="sub">client portal</span></span>
    </a>
    <nav class="sidebar-nav">
      <a class="sidebar-link active" href="/client/dashboard">Dashboard</a>
      <a class="sidebar-link" href="/client/questionnaire">Questionnaire</a>
      <a class="sidebar-link" href="/client/files">Files</a>
      <a class="sidebar-link" href="/client/wearables">Wearables</a>
    </nav>
    <span class="tag sidebar-foot">Phase 2 POC</span>
  </aside>
  <div class="app-main">
    <header class="app-topbar">
      <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/client/dashboard">Client</a><span class="sep">/</span><span class="here">Dashboard</span></nav>
      <div class="user-menu-wrap">
        <button class="user-menu-btn" id="user-menu-btn" type="button"
                aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
          <span class="user-icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="user-menu" id="user-menu" hidden>
          <a class="user-menu-item" href="/account">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            Account</a>
          <button class="user-menu-item" id="logout-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
            Log out</button>
        </div>
      </div>
    </header>

    <main class="pane on">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem" id="stat-cards"></div>
    </main>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/shared.js"></script>
<script>
$('logout-btn').onclick = logout;

function statCard(label, value, sub, href) {
  const numeric = typeof value === 'number';
  return `<a class="card-panel" href="${href}" style="padding:.9rem 1.1rem;text-decoration:none;
      color:inherit;display:flex;align-items:center;justify-content:space-between;gap:1rem">
    <span>
      <span class="nm" style="display:block">${esc(label)}</span>
      <span class="muted xs">${esc(sub)}</span>
    </span>
    <span style="font-size:1.3rem;font-weight:700;flex:0 0 auto" ${numeric ? `data-count-to="${value}"` : ''}>${numeric ? '0' : esc(value)}</span>
  </a>`;
}

async function load() {
  const session = await requireRole('client');
  if (!session) return;

  const [response, files, wearables] = await Promise.all([
    api('/me/questionnaire/response').catch(() => null),
    api('/me/files').catch(() => []),
    api('/me/wearables').catch(() => []),
  ]);

  const connected = (wearables || []).filter((w) => w.status === 'connected').length;

  $('stat-cards').innerHTML = [
    statCard('Questionnaire', response ? 'Submitted' : 'Not yet', response ? 'You can review it any time' : 'Fill it in for your practitioner', '/client/questionnaire'),
    statCard('Files', (files || []).length, 'Uploaded documents', '/client/files'),
    statCard('Wearables', connected, connected ? 'connected' : 'Connect a device', '/client/wearables'),
  ].join('');
  animateCounts($('stat-cards'));
}
load().catch((e) => toast(e.message, 'bad'));
</script>
</body>
</html>
