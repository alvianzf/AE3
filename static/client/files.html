<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Files · Clinic</title>
  <link rel="stylesheet" href="/static/style.css?v=11">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand-link">
      <span class="sprig" aria-hidden="true">
      <svg viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="1.3"
           stroke-linecap="round">
        <path d="M10 23V7"/>
        <path d="M10 13c0-3.6 2.4-6.4 6-7-.3 3.8-2.6 6.4-6 7z" fill="currentColor"
              fill-opacity=".16"/>
        <path d="M10 9.5C10 6 7.8 3.3 4.3 2.5 4.6 6.2 6.7 8.8 10 9.5z"
              fill="currentColor" fill-opacity=".1"/>
      </svg>
      </span>
      <span class="brand"><b>Clinic</b><span class="sub">client portal</span><span class="tag">Phase 2 POC</span></span>
    </a>
    <nav style="margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap">
      <a class="btn ghost sm" href="/client/questionnaire">Questionnaire</a>
      <a class="btn ghost sm" href="/client/files">Files</a>
      <a class="btn ghost sm" href="/client/wearables">Wearables</a>
      <button class="btn ghost sm" id="logout-btn">Log out</button>
    </nav>
  </div>
</header>

<main class="pane on centered" style="max-width:34rem;margin:0 auto">
  <section class="card-panel">
    <div class="ph botanic"><h2 style="flex:1">Upload a file</h2></div>
    <div class="pb">
      <p class="hint">Lab results and similar documents — these become visible to your
        practitioner as part of your record.</p>

      <div id="dropzone" class="dropzone" tabindex="0" role="button"
           aria-label="Choose or drop a file to upload">
        <input type="file" id="f-file" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16V4M8 8l4-4 4 4"/>
          <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <b>Drop a file here</b>
        <span class="muted xs">or click to choose</span>
      </div>
      <div id="chosen" class="muted xs" style="margin-top:.5rem"></div>

      <button id="f-upload" class="btn block" style="margin-top:.7rem" disabled>Upload</button>
      <div id="f-status" class="muted xs" style="margin-top:.5rem"></div>
    </div>
  </section>
</main>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/shared.js"></script>
<script>
$('logout-btn').onclick = logout;
let chosenFile = null;
const dz = $('dropzone');

function pick(file) {
  chosenFile = file;
  $('chosen').textContent = file.name;
  $('f-upload').disabled = false;
}
dz.onclick = () => $('f-file').click();
dz.onkeydown = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); $('f-file').click(); } };
$('f-file').onchange = (e) => { if (e.target.files[0]) pick(e.target.files[0]); };
['dragenter', 'dragover'].forEach((n) => dz.addEventListener(n, (e) => { e.preventDefault(); dz.classList.add('over'); }));
['dragleave', 'drop'].forEach((n) => dz.addEventListener(n, (e) => { e.preventDefault(); dz.classList.remove('over'); }));
dz.addEventListener('drop', (e) => { if (e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]); });

$('f-upload').onclick = async () => {
  if (!chosenFile) return;
  const form = new FormData();
  form.append('file', chosenFile);
  $('f-upload').disabled = true;
  $('f-status').textContent = 'Uploading…';
  try {
    await api('/me/files', { method: 'POST', body: form });
    $('f-status').textContent = '';
    toast('File uploaded');
    chosenFile = null; $('f-file').value = ''; $('chosen').textContent = '';
  } catch (e) {
    $('f-status').textContent = '';
    toast(e.message, 'bad');
  }
  $('f-upload').disabled = false;
};

requireRole('client').then((s) => { if (!s) return; }).catch(() => {});
</script>
</body>
</html>
