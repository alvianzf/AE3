<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Files · Clinic</title>
  <link rel="stylesheet" href="/static/style.css?v=11">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="/client/dashboard" class="brand-link">
      <span class="sprig" aria-hidden="true">
      <svg viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="1.3"
           stroke-linecap="round">
        <path d="M10 23V7"/>
        <path d="M10 13c0-3.6 2.4-6.4 6-7-.3 3.8-2.6 6.4-6 7z" fill="currentColor"
              fill-opacity=".16"/>
        <path d="M10 9.5C10 6 7.8 3.3 4.3 2.5 4.6 6.2 6.7 8.8 10 9.5z"
              fill="currentColor" fill-opacity=".1"/>
      </svg>
      </span>
      <span class="brand"><b>Clinic</b><span class="sub">client portal</span><span class="tag">Phase 2 POC</span></span>
    </a>
    <nav class="sidebar-nav">
      <a class="sidebar-link" href="/client/dashboard">Dashboard</a>
      <a class="sidebar-link" href="/client/questionnaire">Questionnaire</a>
      <a class="sidebar-link active" href="/client/files">Files</a>
      <a class="sidebar-link" href="/client/wearables">Wearables</a>
    </nav>
  </aside>
  <div class="app-main">
    <header class="app-topbar">
      <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/client/dashboard">Client</a><span class="sep">/</span><span class="here">Files</span></nav>
      <div class="user-menu-wrap">
        <button class="user-menu-btn" id="user-menu-btn" type="button"
                aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
          <span class="user-icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="user-menu" id="user-menu" hidden>
          <a class="user-menu-item" href="/account">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            Account</a>
          <button class="user-menu-item" id="logout-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
            Log out</button>
        </div>
      </div>
    </header>

<main class="pane on centered" style="max-width:34rem;margin:0 auto">
  <div style="margin:auto 0;width:100%;display:flex;flex-direction:column;gap:1rem">
    <section class="card-panel">
      <div class="ph botanic"><h2 style="flex:1">Upload a file</h2></div>
      <div class="pb">
        <p class="hint">Lab results and similar documents — these become visible to your
          practitioner as part of your record.</p>

        <div id="dropzone" class="dropzone" tabindex="0" role="button"
             aria-label="Choose or drop a file to upload">
          <input type="file" id="f-file" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 16V4M8 8l4-4 4 4"/>
            <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          <b>Drop a file here</b>
          <span class="muted xs">or click to choose</span>
        </div>
        <div id="chosen" class="muted xs" style="margin-top:.5rem"></div>

        <button id="f-upload" class="btn block" style="margin-top:.7rem" disabled>Upload</button>
        <div id="f-status" class="muted xs" style="margin-top:.5rem"></div>
      </div>
    </section>

    <section class="card-panel">
      <div class="ph botanic"><h2 style="flex:1">Previously uploaded</h2></div>
      <div class="pb tight"><div id="files-list" class="scrollbox"></div></div>
    </section>
  </div>
</main>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/shared.js"></script>
<script>
$('logout-btn').onclick = logout;
let chosenFile = null;
const dz = $('dropzone');

function pick(file) {
  chosenFile = file;
  $('chosen').textContent = file.name;
  $('f-upload').disabled = false;
}
dz.onclick = () => $('f-file').click();
dz.onkeydown = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); $('f-file').click(); } };
$('f-file').onchange = (e) => { if (e.target.files[0]) pick(e.target.files[0]); };
['dragenter', 'dragover'].forEach((n) => dz.addEventListener(n, (e) => { e.preventDefault(); dz.classList.add('over'); }));
['dragleave', 'drop'].forEach((n) => dz.addEventListener(n, (e) => { e.preventDefault(); dz.classList.remove('over'); }));
dz.addEventListener('drop', (e) => { if (e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]); });

async function loadFiles() {
  const list = await api('/me/files');
  $('files-list').innerHTML = list.length
    ? `<ul class="rows">${list.map((f) => `<li class="plain">
        <span class="nm">${esc(f.original_name)}</span>
        <span class="muted xs">${esc((f.uploaded_at || '').slice(0, 16).replace('T', ' '))}</span>
      </li>`).join('')}</ul>`
    : empty('Nothing uploaded yet', 'Files you upload will be listed here.');
}

$('f-upload').onclick = async () => {
  if (!chosenFile) return;
  const form = new FormData();
  form.append('file', chosenFile);
  $('f-upload').disabled = true;
  $('f-status').textContent = 'Uploading…';
  try {
    await api('/me/files', { method: 'POST', body: form });
    $('f-status').textContent = '';
    toast('File uploaded');
    chosenFile = null; $('f-file').value = ''; $('chosen').textContent = '';
    loadFiles();
  } catch (e) {
    $('f-status').textContent = '';
    toast(e.message, 'bad');
  }
  $('f-upload').disabled = false;
};

requireRole('client').then((s) => { if (s) loadFiles(); }).catch(() => {});
</script>
</div>
</div>
</body>
</html>
