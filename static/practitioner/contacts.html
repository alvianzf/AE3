<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacts · Clinic</title>
  <link rel="stylesheet" href="/static/style.css?v=17">
  <link rel="stylesheet" href="/static/dist/theme.css">
  <link rel="stylesheet" href="/static/dist/components.css">
  <script type="module" src="/static/dist/contacts.js"></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="/practitioner/dashboard" class="brand-link">
      <span class="sprig" aria-hidden="true">
      <svg viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="1.3"
           stroke-linecap="round">
        <path d="M10 23V7"/>
        <path d="M10 13c0-3.6 2.4-6.4 6-7-.3 3.8-2.6 6.4-6 7z" fill="currentColor"
              fill-opacity=".16"/>
        <path d="M10 9.5C10 6 7.8 3.3 4.3 2.5 4.6 6.2 6.7 8.8 10 9.5z"
              fill="currentColor" fill-opacity=".1"/>
      </svg>
      </span>
      <span class="brand"><b>Clinic</b><span class="sub">practitioner portal</span></span>
    </a>
    <nav class="sidebar-nav">
      <a class="sidebar-link" href="/practitioner/dashboard">Dashboard</a>
      <a class="sidebar-link" href="/practitioner/consult">Consult</a>
      <a class="sidebar-link active" href="/practitioner/contacts">Contacts</a>
      <a class="sidebar-link" href="/practitioner/knowledge">Knowledge base</a>
      <a class="sidebar-link" id="nav-upgrade" href="/practitioner/upgrade">Upgrade</a>
    </nav>
    <span class="tag sidebar-foot">Phase 2 POC</span>
  </aside>
  <div class="app-main">
    <header class="app-topbar">
      <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/practitioner/dashboard">Practitioner</a><span class="sep">/</span><span class="here">Contacts</span></nav>
      <div class="user-menu-wrap">
        <button class="user-menu-btn" id="user-menu-btn" type="button"
                aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
          <span class="user-icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="user-menu" id="user-menu" hidden>
          <a class="user-menu-item" href="/practitioner/profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
            Profile</a>
          <a class="user-menu-item" href="/account">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            Account</a>
          <button class="user-menu-item" id="logout-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
            Log out</button>
        </div>
      </div>
    </header>

<main class="pane on centered" style="max-width:44rem;margin:0 auto">
  <section class="card-panel">
    <div class="ph botanic">
      <h2 style="flex:1">Contact form submissions</h2>
      <span class="count" id="c-count"></span>
    </div>
    <div class="pb">
      <md-outlined-select id="c-filter" label="Filter by status"
          style="max-width:12rem;margin-bottom:.7rem">
        <md-select-option value="" selected><div slot="headline">All</div></md-select-option>
        <md-select-option value="new"><div slot="headline">New</div></md-select-option>
        <md-select-option value="contacted"><div slot="headline">Contacted</div></md-select-option>
        <md-select-option value="closed"><div slot="headline">Closed</div></md-select-option>
      </md-outlined-select>
      <ul id="c-list" class="rows"></ul>
    </div>
  </section>
</main>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/shared.js"></script>
<script>
$('logout-btn').onclick = logout;

function row(c) {
  return `<li class="plain" data-id="${c.id}" style="display:block;cursor:default">
    <div style="display:flex;justify-content:space-between;gap:.6rem;align-items:baseline;flex-wrap:wrap">
      <span class="nm">${esc(c.client_name)} <span class="muted xs">${esc(c.client_email)}</span></span>
      <span class="chip">${esc(c.status)}</span>
    </div>
    <p class="hint" style="margin:.3rem 0">${esc(c.message)}</p>
    <div style="display:flex;gap:.4rem;align-items:center">
      <span class="muted xs">${esc((c.created_at || '').slice(0, 16).replace('T', ' '))}</span>
      ${c.status !== 'contacted' ? `<button class="btn ghost sm" data-set="contacted">Mark contacted</button>` : ''}
      ${c.status !== 'closed' ? `<button class="btn ghost sm" data-set="closed">Mark closed</button>` : ''}
    </div>
  </li>`;
}

async function load() {
  const session = await requireRole('practitioner');
  loadPractitionerNotifications();
  if (!session) return;
  api('/me/profile').then((p) => { if (p.plan === 'pro') $('nav-upgrade').hidden = true; });
  const q = $('c-filter').value ? '?status=' + $('c-filter').value : '';
  const list = await api('/me/contacts' + q);
  $('c-count').textContent = list.length || '';
  $('c-list').innerHTML = list.length ? list.map(row).join('')
    : empty('No submissions yet', 'Messages from your coach-detail page will show up here.');

  $('c-list').querySelectorAll('[data-set]').forEach((btn) => {
    btn.onclick = async () => {
      const li = btn.closest('li');
      const status = btn.dataset.set;
      try {
        // 08-api.md documents GET /api/me/contacts but not a status-update
        // route; core_store.update_contact_status(submission_id, status)
        // exists, so this assumes a matching PATCH route. Flagging for the
        // integrator to confirm the exact path/verb once auth.py's routes land.
        await api(`/me/contacts/${li.dataset.id}`, json('PATCH', { status }));
        toast('Updated');
        load();
      } catch (e) { toast(e.message, 'bad'); }
    };
  });
}
$('c-filter').onchange = load;
load().catch((e) => toast(e.message, 'bad'));
</script>
</div>
</div>
</body>
</html>
