<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My clients · Clinic</title>
  <link rel="stylesheet" href="/static/style.css?v=11">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="/practitioner/dashboard" class="brand-link">
      <span class="sprig" aria-hidden="true">
      <svg viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="1.3"
           stroke-linecap="round">
        <path d="M10 23V7"/>
        <path d="M10 13c0-3.6 2.4-6.4 6-7-.3 3.8-2.6 6.4-6 7z" fill="currentColor"
              fill-opacity=".16"/>
        <path d="M10 9.5C10 6 7.8 3.3 4.3 2.5 4.6 6.2 6.7 8.8 10 9.5z"
              fill="currentColor" fill-opacity=".1"/>
      </svg>
      </span>
      <span class="brand"><b>Clinic</b><span class="sub">practitioner portal</span></span>
    </a>
    <nav class="sidebar-nav">
      <a class="sidebar-link" href="/practitioner/dashboard">Dashboard</a>
      <a class="sidebar-link" href="/practitioner/consult">Consult</a>
      <a class="sidebar-link" href="/practitioner/contacts">Contacts</a>
      <a class="sidebar-link" href="/practitioner/knowledge">Knowledge base</a>
      <a class="sidebar-link" id="nav-upgrade" href="/practitioner/upgrade">Upgrade</a>
    </nav>
    <span class="tag sidebar-foot">Phase 2 POC</span>
  </aside>
  <div class="app-main">
    <header class="app-topbar">
      <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/practitioner/dashboard">Practitioner</a><span class="sep">/</span><span class="here">Clients</span></nav>
      <div class="user-menu-wrap">
        <button class="user-menu-btn" id="user-menu-btn" type="button"
                aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
          <span class="user-icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="user-menu" id="user-menu" hidden>
          <a class="user-menu-item" href="/practitioner/profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
            Profile</a>
          <a class="user-menu-item" href="/account">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            Account</a>
          <button class="user-menu-item" id="logout-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
            Log out</button>
        </div>
      </div>
    </header>

<main class="pane on centered" style="max-width:44rem;margin:0 auto">
  <section class="card-panel" id="pro-gate" hidden>
    <div class="pb"><div class="empty">
      <b>Clients are a Pro feature</b>
      <p>Adding and managing clients needs the Pro plan.</p>
      <a class="btn" href="/practitioner/upgrade">Upgrade to Pro</a>
    </div></div>
  </section>

  <section class="card-panel" id="clients-panel" hidden>
    <div class="ph botanic">
      <h2 style="flex:1">My clients</h2>
      <span class="count" id="cl-count"></span>
    </div>
    <div class="pb">
      <ul id="cl-list" class="rows"></ul>
      <details class="disc" id="cl-add-details" style="margin-top:.6rem">
        <summary>Add a client</summary>
        <div>
          <input id="cl-name" placeholder="Full name" aria-label="Client name">
          <input id="cl-email" type="email" placeholder="Email" style="margin-top:.4rem"
                 aria-label="Client email">
          <button id="cl-create" class="btn block" style="margin-top:.5rem">Add client</button>
        </div>
      </details>
    </div>
  </section>
</main>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/shared.js"></script>
<script>
$('logout-btn').onclick = logout;

function row(c) {
  return `<li class="plain">
    <a href="/practitioner/clients/${c.id}" style="display:flex;align-items:center;gap:.6rem;text-decoration:none;color:inherit;width:100%">
      <span class="av">${esc((c.name || '?').slice(0, 1).toUpperCase())}</span>
      <span class="grow"><span class="nm">${esc(c.name)}</span>
      <span class="sub2">${esc(c.email)}</span></span>
    </a>
  </li>`;
}

async function load() {
  const session = await requireRole('practitioner');
  loadPractitionerNotifications();
  if (!session) return;
  const p = await api('/me/profile');
  if (p.plan === 'pro') $('nav-upgrade').hidden = true;
  if (p.plan !== 'pro') { $('pro-gate').hidden = false; return; }
  $('clients-panel').hidden = false;

  const list = await api('/me/clients');
  $('cl-count').textContent = list.length || '';
  $('cl-list').innerHTML = list.length ? list.map(row).join('')
    : empty('No clients yet', 'Add one below, or wait for a client to sign up and pick you.');
  // Nothing else on this page for a brand-new practitioner to look at —
  // don't make the single most useful action a collapsed disclosure they
  // have to notice and open first (specs/v2/14-ux-findings-v2.7.md P9).
  if (!list.length) $('cl-add-details').open = true;
}

$('cl-create').onclick = async () => {
  const name = $('cl-name').value.trim();
  const email = $('cl-email').value.trim();
  if (!name || !email) { toast('Name and email are required', 'bad'); return; }
  try {
    await api('/me/clients', json('POST', { name, email }));
    $('cl-name').value = ''; $('cl-email').value = '';
    toast('Client added');
    load();
  } catch (e) { toast(e.message, 'bad'); }
};

load().catch((e) => toast(e.message, 'bad'));
</script>
</div>
</div>
</body>
</html>
