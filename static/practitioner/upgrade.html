<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upgrade to Pro · Clinic</title>
  <link rel="stylesheet" href="/static/style.css?v=11">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="/practitioner/consult" class="brand-link">
      <span class="sprig" aria-hidden="true">
      <svg viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="1.3"
           stroke-linecap="round">
        <path d="M10 23V7"/>
        <path d="M10 13c0-3.6 2.4-6.4 6-7-.3 3.8-2.6 6.4-6 7z" fill="currentColor"
              fill-opacity=".16"/>
        <path d="M10 9.5C10 6 7.8 3.3 4.3 2.5 4.6 6.2 6.7 8.8 10 9.5z"
              fill="currentColor" fill-opacity=".1"/>
      </svg>
      </span>
      <span class="brand"><b>Clinic</b><span class="sub">practitioner portal</span><span class="tag">Phase 2 POC</span></span>
    </a>
    <nav class="sidebar-nav">
      <a class="sidebar-link" href="/practitioner/consult">Consult</a>
      <a class="sidebar-link" href="/practitioner/contacts">Contacts</a>
      <a class="sidebar-link" href="/practitioner/knowledge">Knowledge base</a>
      <a class="sidebar-link active" href="/practitioner/upgrade" id="nav-upgrade">Upgrade</a>
    </nav>
  </aside>
  <div class="app-main">
    <header class="app-topbar">
      <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/practitioner/consult">Practitioner</a><span class="sep">/</span><span class="here">Upgrade</span></nav>
      <div class="user-menu-wrap">
        <button class="user-menu-btn" id="user-menu-btn" type="button"
                aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
          <span class="user-icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="user-menu" id="user-menu" hidden>
          <a class="user-menu-item" href="/practitioner/profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
            Profile</a>
          <a class="user-menu-item" href="/account">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
            Account</a>
          <button class="user-menu-item" id="logout-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
            Log out</button>
        </div>
      </div>
    </header>

<main class="pane on centered" style="max-width:32rem;margin:0 auto">
  <section class="card-panel">
    <div class="ph botanic"><h2 style="flex:1">Upgrade to Pro</h2></div>
    <div class="pb" id="upgrade-body">
      <p class="hint">Pro adds RAG-backed consultations against the shared knowledge library,
        your own client vault, and the ability to add clients directly. Billed through Stripe.</p>
      <button id="u-go" class="btn block">Upgrade to Pro</button>
      <div id="u-status" class="muted xs" style="margin-top:.5rem"></div>
    </div>
  </section>
</main>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/shared.js"></script>
<script>
$('logout-btn').onclick = logout;

async function load() {
  const session = await requireRole('practitioner');
  if (!session) return;
  const p = await api('/me/profile');
  if (p.plan === 'pro') {
    $('nav-upgrade').hidden = true;
    $('upgrade-body').innerHTML = `<div class="empty">${icon('leaf')}<b>Already on Pro</b>`
      + `<p>Head to <a href="/practitioner/consult">Consult</a> to get started.</p></div>`;
  }
}

$('u-go').onclick = async () => {
  $('u-go').disabled = true;
  $('u-status').textContent = 'Starting checkout…';
  try {
    const r = await api('/me/upgrade', { method: 'POST' });
    if (r?.url) { location.href = r.url; }
    else { $('u-status').textContent = ''; toast('No checkout URL returned', 'bad'); }
  } catch (e) {
    $('u-status').textContent = '';
    toast(e.message, 'bad');
  }
  $('u-go').disabled = false;
};

load().catch((e) => toast(e.message, 'bad'));
</script>
</div>
</div>
</body>
</html>
