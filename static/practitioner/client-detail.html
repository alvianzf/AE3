<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client · Clinic</title>
  <link rel="stylesheet" href="/static/style.css?v=11">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="/practitioner/dashboard" class="brand-link">
      <span class="sprig" aria-hidden="true">
      <svg viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="1.3"
           stroke-linecap="round">
        <path d="M10 23V7"/>
        <path d="M10 13c0-3.6 2.4-6.4 6-7-.3 3.8-2.6 6.4-6 7z" fill="currentColor"
              fill-opacity=".16"/>
        <path d="M10 9.5C10 6 7.8 3.3 4.3 2.5 4.6 6.2 6.7 8.8 10 9.5z"
              fill="currentColor" fill-opacity=".1"/>
      </svg>
      </span>
      <span class="brand"><b>Clinic</b><span class="sub">practitioner portal</span><span class="tag">Phase 2 POC</span></span>
    </a>
    <nav class="sidebar-nav">
      <a class="sidebar-link" href="/practitioner/dashboard">Dashboard</a>
      <a class="sidebar-link" href="/practitioner/consult">Consult</a>
      <a class="sidebar-link" href="/practitioner/contacts">Contacts</a>
      <a class="sidebar-link" href="/practitioner/knowledge">Knowledge base</a>
      <a class="sidebar-link" id="nav-upgrade" href="/practitioner/upgrade">Upgrade</a>
    </nav>
  </aside>
  <div class="app-main">
    <header class="app-topbar">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="/practitioner/dashboard">Practitioner</a><span class="sep">/</span>
        <a href="/practitioner/clients">Clients</a><span class="sep">/</span>
        <span class="here" id="bc-name">…</span>
      </nav>
      <div class="user-menu-wrap">
        <button class="user-menu-btn" id="user-menu-btn" type="button"
                aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
          <span class="user-icon-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="user-menu" id="user-menu" hidden>
          <a class="user-menu-item" href="/practitioner/profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
            Profile</a>
          <a class="user-menu-item" href="/account">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            Account</a>
          <button class="user-menu-item" id="logout-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
            Log out</button>
        </div>
      </div>
    </header>

    <main class="pane on" style="max-width:68rem;margin:0 auto">
      <section class="card-panel" id="header-panel">
        <div class="pb" style="display:flex;align-items:center;gap:.8rem;flex-wrap:wrap">
          <span class="av" id="cl-avatar" style="width:2.6rem;height:2.6rem;font-size:1.1rem">?</span>
          <div class="grow">
            <div style="font-weight:650;font-size:1.05rem" id="cl-name">…</div>
            <div class="muted xs" id="cl-email"></div>
          </div>
          <a class="btn ghost sm" href="/practitioner/consult" id="cl-consult-link">Start consultation</a>
        </div>
      </section>

      <div style="display:flex;gap:.4rem;margin:1rem 0" role="tablist">
        <button class="btn ghost sm" id="tab-intake" type="button" data-tab="intake">Intake review</button>
        <button class="btn ghost sm" id="tab-history" type="button" data-tab="history">Consultations &amp; reports</button>
      </div>

      <div id="panel-intake">
        <section class="card-panel">
          <div class="ph botanic"><h2 style="flex:1">Intake review</h2></div>
          <div class="pb" id="intake-body">
            <div class="skel w40"></div><div class="skel w80"></div><div class="skel w60"></div>
          </div>
        </section>
      </div>

      <div id="panel-history" hidden style="display:grid;grid-template-columns:minmax(0,1fr) 18rem;gap:1rem;align-items:start">
        <section class="card-panel">
          <div class="ph botanic">
            <h2 style="flex:1">Previous consultations</h2>
            <span class="count" id="sess-count"></span>
          </div>
          <div class="pb" id="sessions-body">
            <div class="skel w40"></div><div class="skel w80"></div>
          </div>
        </section>

        <section class="card-panel">
          <div class="ph botanic"><h2 style="flex:1">Reports &amp; documents</h2></div>
          <div class="pb tight" id="documents-body">
            <div class="skel w60" style="margin:.6rem"></div>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/shared.js"></script>
<script>
$('logout-btn').onclick = logout;

const clientId = location.pathname.split('/').filter(Boolean).pop();
let practitionerId = null;

/* ── Tabs ────────────────────────────────────────────────────────────────── */
function showTab(name) {
  $('panel-intake').hidden = name !== 'intake';
  $('panel-history').hidden = name !== 'history';
  $('tab-intake').classList.toggle('on', name === 'intake');
  $('tab-history').classList.toggle('on', name === 'history');
}
$('tab-intake').onclick = () => showTab('intake');
$('tab-history').onclick = () => showTab('history');

/* ── Intake review (themed questionnaire answers + clinician notes) ────────── */
const QUESTION_LABELS = { text: 'Text', number: 'Number', date: 'Date', choice: 'Choice', multi_choice: 'Checklist' };

function formatAnswer(q, value) {
  if (value === undefined || value === null || value === '') return '<span class="muted xs">not answered</span>';
  if (Array.isArray(value)) return esc(value.join(', '));
  return esc(String(value));
}

async function loadIntake() {
  const data = await api(`/me/clients/${clientId}/intake`);
  if (!data.response || !data.questionnaire) {
    $('intake-body').innerHTML = empty('No questionnaire response yet',
      'This client hasn’t submitted an intake questionnaire.');
    return;
  }
  const byTheme = {};
  for (const q of data.questionnaire.questions) {
    (byTheme[q.theme || 'General'] ??= []).push(q);
  }
  const notes = data.notes || {};
  const answers = data.response.answers || {};
  $('intake-body').innerHTML = Object.entries(byTheme).map(([theme, qs]) => `
    <div class="card-panel" style="padding:.8rem;margin-bottom:.8rem">
      <h3 style="margin:0 0 .5rem;font-size:.9rem">${esc(theme)}</h3>
      <div style="display:flex;flex-direction:column;gap:.5rem">
        ${qs.map((q) => `
          <div>
            <div class="muted xs">${esc(q.prompt)} <span class="chip" style="margin-left:.3rem">${QUESTION_LABELS[q.input_type] || q.input_type}</span></div>
            <div>${formatAnswer(q, answers[q.id])}</div>
          </div>`).join('')}
      </div>
      <label class="lbl" style="margin-top:.7rem">Your notes for this theme</label>
      <textarea data-theme="${esc(theme)}" rows="3" placeholder="Clinician notes…">${esc(notes[theme] || '')}</textarea>
      <button class="btn ghost sm" data-save-note="${esc(theme)}" type="button" style="margin-top:.4rem">Save note</button>
    </div>
  `).join('');
  $('intake-body').querySelectorAll('[data-save-note]').forEach((btn) => {
    btn.onclick = async () => {
      const theme = btn.dataset.saveNote;
      const note = $('intake-body').querySelector(`textarea[data-theme="${CSS.escape(theme)}"]`).value;
      try {
        await api(`/me/clients/${clientId}/intake/notes`, json('PUT', { theme, note }));
        toast('Note saved');
      } catch (e) { toast(e.message, 'bad'); }
    };
  });
}

/* ── Consultations + documents ──────────────────────────────────────────── */
function turnRow(t, i) {
  return `<div style="padding:.5rem 0;border-top:1px solid var(--line)">
    <div class="muted xs">#${i + 1} · ${esc((t.created_at || '').slice(0, 16).replace('T', ' '))}</div>
    <div style="font-weight:600;margin-top:.2rem">${esc(t.question)}</div>
    <div style="margin-top:.3rem;white-space:pre-wrap">${esc(t.answer)}</div>
  </div>`;
}

const DOC_AUDIENCE = {
  clinician_note: { label: 'Clinician note', audience: 'Internal — only you can see this', accent: 'var(--line-2)' },
  client_report: { label: 'Client report', audience: 'Shared with the client', accent: 'var(--accent)' },
};

function documentEditor(sessionId, kind, doc, label) {
  const status = doc?.status || 'draft';
  const meta = DOC_AUDIENCE[kind];
  return `<div style="margin-top:.7rem;padding:.6rem .7rem;border-left:3px solid ${meta.accent};background:var(--panel-2);border-radius:0 var(--r) var(--r) 0">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.3rem">
      <div>
        <label class="lbl" style="margin:0">${label}</label>
        <div class="muted xs">${meta.audience}</div>
      </div>
      <span class="chip${status === 'final' ? '' : ' warn'}">${status}</span>
    </div>
    <textarea data-doc="${kind}" rows="4" placeholder="Write ${label.toLowerCase()}…"
              style="margin-top:.4rem">${esc(doc?.content || '')}</textarea>
    <div style="display:flex;gap:.4rem;margin-top:.3rem">
      <button class="btn ghost sm" data-save-doc="${kind}" data-status="draft" type="button">Save draft</button>
      <button class="btn ghost sm" data-save-doc="${kind}" data-status="final" type="button">Mark final</button>
    </div>
  </div>`;
}

async function expandSession(sessionId, container) {
  const s = await api(`/me/clients/${clientId}/sessions/${sessionId}`);
  container.innerHTML = `
    <div style="padding:.6rem 0">
      ${(s.turns || []).map(turnRow).join('') || '<p class="hint">No turns recorded.</p>'}
    </div>
    ${documentEditor(sessionId, 'clinician_note', s.documents.clinician_note, 'Clinician note')}
    ${documentEditor(sessionId, 'client_report', s.documents.client_report, 'Client report')}
  `;
  container.querySelectorAll('[data-save-doc]').forEach((btn) => {
    btn.onclick = async () => {
      const kind = btn.dataset.saveDoc;
      const content = container.querySelector(`textarea[data-doc="${kind}"]`).value;
      try {
        await api(`/me/clients/${clientId}/sessions/${sessionId}/documents/${kind}`,
          json('PUT', { content, status: btn.dataset.status }));
        toast(btn.dataset.status === 'final' ? 'Marked final' : 'Draft saved');
        loadDocuments();
        expandSession(sessionId, container);
      } catch (e) { toast(e.message, 'bad'); }
    };
  });
}

const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

function sessionRow(s, i) {
  const d = new Date(s.started_at);
  const day = isNaN(d) ? '–' : d.getDate();
  const mon = isNaN(d) ? '' : MONTHS[d.getMonth()];
  const continueLink = s.status !== 'done'
    ? `<a class="btn sm" href="/practitioner/consult?client=${clientId}&session=${s.id}">Continue in Consult</a>`
    : '';
  return `<li class="plain" data-id="${s.id}" style="display:flex;gap:.7rem;align-items:flex-start">
    <span class="cal-icon"><span class="day">${day}</span><span class="mon">${mon}</span></span>
    <div class="grow">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap">
        <span><b>${esc(s.title)}</b> <span class="chip${s.status === 'done' ? '' : ' warn'}" style="margin-left:.3rem">${s.status === 'done' ? 'done' : 'in progress'}</span></span>
        <span style="display:flex;gap:.4rem;align-items:center">
          ${continueLink}
          <button class="btn ghost sm" data-toggle-status type="button">${s.status === 'done' ? 'Reopen' : 'Mark done'}</button>
          <button class="btn ghost sm" data-open type="button">Open</button>
        </span>
      </div>
      <span class="muted xs">${s.turns} turn${s.turns === 1 ? '' : 's'}</span>
      <div data-detail hidden></div>
    </div>
  </li>`;
}

async function loadSessions() {
  const list = await api(`/me/clients/${clientId}/sessions`);
  $('sess-count').textContent = list.length || '';
  $('sessions-body').innerHTML = list.length
    ? `<ul class="rows">${list.map(sessionRow).join('')}</ul>`
    : empty('No consultations yet', 'Start one from the client header above.');
  $('sessions-body').querySelectorAll('[data-open]').forEach((btn) => {
    btn.onclick = () => {
      const li = btn.closest('[data-id]');
      const detail = li.querySelector('[data-detail]');
      detail.hidden = !detail.hidden;
      if (!detail.hidden) expandSession(li.dataset.id, detail);
    };
  });
  $('sessions-body').querySelectorAll('[data-toggle-status]').forEach((btn) => {
    btn.onclick = async () => {
      const li = btn.closest('[data-id]');
      const current = btn.textContent.trim() === 'Reopen' ? 'done' : 'in_progress';
      const next = current === 'done' ? 'in_progress' : 'done';
      try {
        await api(`/me/clients/${clientId}/sessions/${li.dataset.id}/status`,
          { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: next }) });
        toast('Status updated');
        loadSessions();
      } catch (e) { toast(e.message, 'bad'); }
    };
  });
}

function documentRow(d) {
  const meta = DOC_AUDIENCE[d.kind] || { label: d.kind };
  return `<div data-jump-session="${d.session_id}" style="padding:.5rem 0;border-top:1px solid var(--line);cursor:pointer">
    <div style="display:flex;justify-content:space-between;gap:.4rem">
      <span class="nm" style="font-size:.85rem">${meta.label}</span>
      <span class="chip${d.status === 'final' ? '' : ' warn'}">${d.status}</span>
    </div>
    <div class="muted xs">${esc(d.session_title)}</div>
  </div>`;
}

async function loadDocuments() {
  const list = await api(`/me/clients/${clientId}/documents`);
  $('documents-body').innerHTML = list.length
    ? list.map(documentRow).join('')
    : empty('No documents yet', 'Notes and reports appear here once written.');
  $('documents-body').querySelectorAll('[data-jump-session]').forEach((row) => {
    row.onclick = () => {
      showTab('history');
      const li = $('sessions-body').querySelector(`[data-id="${row.dataset.jumpSession}"]`);
      if (!li) return;
      const detail = li.querySelector('[data-detail]');
      if (detail.hidden) {
        detail.hidden = false;
        expandSession(row.dataset.jumpSession, detail);
      }
      li.scrollIntoView({ behavior: 'smooth', block: 'center' });
      li.style.outline = '2px solid var(--accent)';
      setTimeout(() => { li.style.outline = ''; }, 1500);
    };
  });
}

async function load() {
  const session = await requireRole('practitioner');
  loadPractitionerNotifications();
  if (!session) return;
  practitionerId = session.id;
  const p = await api('/me/profile');
  if (p.plan !== 'pro') { location.href = '/practitioner/clients'; return; }
  $('nav-upgrade').hidden = true;

  const client = await api(`/me/clients/${clientId}`);
  $('cl-name').textContent = client.name;
  $('bc-name').textContent = client.name;
  $('cl-email').textContent = client.email;
  $('cl-avatar').textContent = (client.name || '?').slice(0, 1).toUpperCase();
  $('cl-consult-link').href = '/practitioner/consult?client=' + clientId;

  showTab('intake');
  loadIntake().catch((e) => toast(e.message, 'bad'));
  loadSessions().catch((e) => toast(e.message, 'bad'));
  loadDocuments().catch((e) => toast(e.message, 'bad'));
}
load().catch((e) => toast(e.message, 'bad'));
</script>
</body>
</html>
