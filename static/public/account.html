<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account · Clinic</title>
  <link rel="stylesheet" href="/static/style.css?v=18">
  <link rel="stylesheet" href="/static/dist/theme.css">
  <link rel="stylesheet" href="/static/dist/components.css">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0">
  <script type="module" src="/static/dist/account.js"></script>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="/directory" class="brand-link" id="acc-brand-link">
      <span class="sprig" aria-hidden="true">
      <svg viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="1.3"
           stroke-linecap="round">
        <path d="M10 23V7"/>
        <path d="M10 13c0-3.6 2.4-6.4 6-7-.3 3.8-2.6 6.4-6 7z" fill="currentColor"
              fill-opacity=".16"/>
        <path d="M10 9.5C10 6 7.8 3.3 4.3 2.5 4.6 6.2 6.7 8.8 10 9.5z"
              fill="currentColor" fill-opacity=".1"/>
      </svg>
      </span>
      <span class="brand"><b>Clinic</b><span class="sub">account settings</span></span>
    </a>
    <nav class="sidebar-nav">
      <a class="sidebar-link" href="#" id="acc-back-link">Back to my portal</a>
    </nav>
    <span class="tag sidebar-foot">Phase 2 POC</span>
  </aside>
  <div class="app-main">
    <header class="app-topbar">
      <nav style="margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap">
        <button class="btn ghost sm" id="logout-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>Log out</button>
      </nav>
    </header>

<main class="pane on centered" style="max-width:26rem;margin:0 auto">
  <section class="card-panel">
    <div class="ph botanic"><h2 style="flex:1">Change password</h2></div>
    <div class="pb">
      <p class="hint" id="acc-role"></p>

      <md-outlined-text-field id="a-current" type="password" label="Current password"
          autocomplete="current-password" style="width:100%">
        <md-icon-button toggle slot="trailing-icon" aria-label="Show password">
          <md-icon>visibility</md-icon>
          <md-icon slot="selected">visibility_off</md-icon>
        </md-icon-button>
      </md-outlined-text-field>

      <md-outlined-text-field id="a-new" type="password" label="New password"
          autocomplete="new-password" style="width:100%;margin-top:.9rem">
        <md-icon-button toggle slot="trailing-icon" aria-label="Show password">
          <md-icon>visibility</md-icon>
          <md-icon slot="selected">visibility_off</md-icon>
        </md-icon-button>
      </md-outlined-text-field>
      <p class="hint xs">At least 8 characters.</p>

      <md-outlined-text-field id="a-new2" type="password" label="Confirm new password"
          autocomplete="new-password" style="width:100%">
        <md-icon-button toggle slot="trailing-icon" aria-label="Show password">
          <md-icon>visibility</md-icon>
          <md-icon slot="selected">visibility_off</md-icon>
        </md-icon-button>
      </md-outlined-text-field>

      <md-filled-button id="a-submit" style="width:100%;margin-top:.9rem">Update password</md-filled-button>
      <div id="a-status" class="muted xs" style="margin-top:.5rem"></div>
    </div>
  </section>
</main>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/shared.js"></script>
<script>
async function load() {
  const session = await currentSession();
  if (!session) { location.href = '/login'; return; }
  $('acc-role').textContent = `Signed in as ${session.role}.`;
  // Every other authenticated page's logo goes to that role's own portal
  // home — account.html was the one exception, pointing at the public
  // marketing site instead (specs/v2/14-ux-findings-v2.7.md S2).
  const home = DASHBOARD_FOR_ROLE[session.role] || '/login';
  $('acc-brand-link').href = home;
  $('acc-back-link').href = home;
}
load();

$('logout-btn').onclick = logout;

$('a-submit').onclick = async () => {
  const current_password = $('a-current').value;
  const new_password = $('a-new').value;
  const confirm = $('a-new2').value;
  if (!current_password || !new_password) {
    toast('Fill in both password fields', 'bad'); return;
  }
  if (new_password.length < 8) {
    toast('New password must be at least 8 characters', 'bad'); return;
  }
  if (new_password !== confirm) {
    toast('New passwords do not match', 'bad'); return;
  }
  $('a-submit').disabled = true;
  $('a-status').textContent = 'Updating…';
  try {
    await api('/auth/change-password', json('POST', { current_password, new_password }));
    $('a-status').textContent = '';
    $('a-current').value = ''; $('a-new').value = ''; $('a-new2').value = '';
    toast('Password updated');
  } catch (e) {
    $('a-status').textContent = '';
    toast(e.status === 401 ? 'Current password is incorrect' : e.message, 'bad');
  }
  $('a-submit').disabled = false;
};
</script>
</div>
</div>
</body>
</html>
