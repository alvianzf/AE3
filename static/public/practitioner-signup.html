<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join as a practitioner · Clinic</title>
  <link rel="stylesheet" href="/static/style.css?v=11">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/directory" class="brand-link">
      <span class="sprig" aria-hidden="true">
      <svg viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="1.3"
           stroke-linecap="round">
        <path d="M10 23V7"/>
        <path d="M10 13c0-3.6 2.4-6.4 6-7-.3 3.8-2.6 6.4-6 7z" fill="currentColor"
              fill-opacity=".16"/>
        <path d="M10 9.5C10 6 7.8 3.3 4.3 2.5 4.6 6.2 6.7 8.8 10 9.5z"
              fill="currentColor" fill-opacity=".1"/>
      </svg>
      </span>
      <span class="brand"><b>Clinic</b><span class="sub">clinical knowledge assistant</span><span class="tag">Phase 2 POC</span></span>
    </a>
    <nav style="margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap">
      <a class="btn ghost sm" href="/about">About</a>
      <a class="btn ghost sm" href="/directory">Find a practitioner</a>
      <a class="btn ghost sm" href="/join">Join as a practitioner</a>
      <a class="btn ghost sm" href="/signup">Sign up</a>
      <a class="btn sm" href="/login">Log in</a>
    </nav>
  </div>
</header>

<main class="pane on centered" style="max-width:38rem;margin:0 auto">
  <section class="card-panel">
    <div class="ph botanic"><h2 style="flex:1">Join as a practitioner</h2></div>
    <div class="pb">
      <p class="hint">Submit your profile for review. You'll be listed in the directory once
        an admin approves it — every new practitioner starts on the Basic plan.</p>

      <label class="lbl" for="s-name">Full name</label>
      <input id="s-name" placeholder="Full name" aria-label="Full name">

      <label class="lbl" for="s-email">Email</label>
      <input id="s-email" type="email" placeholder="you@example.com" aria-label="Email">

      <label class="lbl" for="s-password">Password</label>
      <input id="s-password" type="password" placeholder="At least 8 characters"
             aria-label="Password">

      <label class="lbl" for="s-bio">Bio</label>
      <textarea id="s-bio" rows="4"
        placeholder="Tell clients about your practice — this appears on your profile"></textarea>

      <label class="lbl" for="s-specialties">Specialties</label>
      <input id="s-specialties" placeholder="Comma-separated, e.g. Nutrition, Endocrinology"
             aria-label="Specialties">

      <label class="lbl" for="s-languages">Languages</label>
      <input id="s-languages" placeholder="Comma-separated, e.g. English, Spanish"
             aria-label="Languages">

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.6rem">
        <div>
          <label class="lbl" for="s-years">Years of experience</label>
          <input id="s-years" type="number" min="0" placeholder="e.g. 6" aria-label="Years of experience">
        </div>
        <div>
          <label class="lbl" for="s-price">Consultation price (USD)</label>
          <input id="s-price" type="number" min="0" step="0.01" placeholder="e.g. 120"
                 aria-label="Consultation price">
        </div>
      </div>

      <label class="lbl" for="s-photo">Photo</label>
      <input id="s-photo" type="file" accept="image/*" aria-label="Photo">

      <button id="s-submit" class="btn block" style="margin-top:.9rem">Submit application</button>
      <div id="s-status" class="muted xs" style="margin-top:.5rem"></div>
    </div>
  </section>
</main>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/shared.js"></script>
<script>
const splitList = (v) => v.split(',').map((s) => s.trim()).filter(Boolean);

$('s-submit').onclick = async () => {
  const name = $('s-name').value.trim();
  const email = $('s-email').value.trim();
  const password = $('s-password').value;
  if (!name || !email || !password) {
    toast('Name, email and password are required', 'bad'); return;
  }

  const form = new FormData();
  form.append('name', name);
  form.append('email', email);
  form.append('password', password);
  form.append('bio', $('s-bio').value.trim());
  form.append('specialties', JSON.stringify(splitList($('s-specialties').value)));
  form.append('languages', JSON.stringify(splitList($('s-languages').value)));
  form.append('years_experience', $('s-years').value || '0');
  const priceUsd = parseFloat($('s-price').value || '0');
  form.append('consultation_price_cents', String(Math.round(priceUsd * 100)));
  if ($('s-photo').files[0]) form.append('photo', $('s-photo').files[0]);

  $('s-submit').disabled = true;
  $('s-status').textContent = 'Submitting…';
  try {
    await api('/practitioners', { method: 'POST', body: form });
    $('s-status').textContent = '';
    toast('Application submitted — you’ll be listed once an admin approves it');
    ['s-name','s-email','s-password','s-bio','s-specialties','s-languages','s-years','s-price']
      .forEach((id) => { $(id).value = ''; });
    $('s-photo').value = '';
  } catch (e) {
    $('s-status').textContent = '';
    toast(e.message, 'bad');
  }
  $('s-submit').disabled = false;
};
</script>
</body>
</html>
