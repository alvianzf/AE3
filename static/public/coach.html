<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practitioner · Clinic</title>
  <link rel="stylesheet" href="/static/style.css?v=11">
  <style>
    .coach-photo-lg { width: 9rem; height: 9rem; border-radius: var(--r-lg);
                       object-fit: cover; background: var(--bg); border: 1px solid var(--line); }
  </style>
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="/directory" class="brand-link">
      <span class="sprig" aria-hidden="true">
      <svg viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="1.3"
           stroke-linecap="round">
        <path d="M10 23V7"/>
        <path d="M10 13c0-3.6 2.4-6.4 6-7-.3 3.8-2.6 6.4-6 7z" fill="currentColor"
              fill-opacity=".16"/>
        <path d="M10 9.5C10 6 7.8 3.3 4.3 2.5 4.6 6.2 6.7 8.8 10 9.5z"
              fill="currentColor" fill-opacity=".1"/>
      </svg>
      </span>
      <span class="brand"><b>Clinic</b><span class="sub">clinical knowledge assistant</span><span class="tag">Phase 2 POC</span></span>
    </a>
    <nav class="sidebar-nav">
      <a class="sidebar-link" href="/about">About</a>
      <a class="sidebar-link" href="/directory">Find a practitioner</a>
      <a class="sidebar-link" href="/join">Join as a practitioner</a>
      <a class="sidebar-link" href="/signup" data-auth-link="signup">Sign up</a>
      <a class="sidebar-link" href="/login" data-auth-link="login">Log in</a>
    </nav>
  </aside>
  <div class="app-main">

<main class="pane on centered" style="max-width:52rem;margin:0 auto">
  <section class="card-panel" id="coach-panel">
    <div class="ph botanic"><h2 style="flex:1">Practitioner profile</h2></div>
    <div class="pb" id="coach-body">
      <div class="skel w40"></div><div class="skel w80"></div><div class="skel w60"></div>
    </div>
  </section>

  <section class="card-panel" id="contact-panel" style="margin-top:1rem" hidden>
    <div class="ph botanic"><h2 style="flex:1">Get in touch</h2></div>
    <div class="pb">
      <p class="hint">Send a message to ask about working together. This starts a
        conversation — it doesn't book a slot.</p>
      <label class="lbl" for="c-name">Your name</label>
      <input id="c-name" placeholder="Full name" aria-label="Your name">
      <label class="lbl" for="c-email">Your email</label>
      <input id="c-email" type="email" placeholder="you@example.com" aria-label="Your email">
      <label class="lbl" for="c-message">Message</label>
      <textarea id="c-message" rows="4" placeholder="What would you like help with?"></textarea>
      <button id="c-send" class="btn block" style="margin-top:.7rem">Send message</button>
    </div>
  </section>

  <section class="card-panel" id="signup-panel" style="margin-top:1rem" hidden>
    <div class="pb" style="display:flex;align-items:center;gap:.8rem;flex-wrap:wrap">
      <span class="grow muted small">Ready to work together?</span>
      <a class="btn" id="become-client-link" href="#">Sign up as their client</a>
    </div>
  </section>
</main>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/shared.js"></script>
<script>
// Path is /coach/{id} — no query string, so pull it off the URL directly.
const id = location.pathname.split('/').filter(Boolean).pop();

function centsToPrice(c) {
  if (!c && c !== 0) return null;
  return '$' + (c / 100).toFixed(c % 100 ? 2 : 0);
}

async function load() {
  if (!id) {
    $('coach-body').innerHTML = empty('No practitioner specified',
      'Pick someone from the <a href="/directory">directory</a>.');
    return;
  }
  let p;
  try {
    // The GET here is what logs the profile_view_events row server-side
    // per specs/v2/03-website.md — nothing duplicated client-side.
    p = await api('/practitioners/' + encodeURIComponent(id));
  } catch (e) {
    $('coach-body').innerHTML = empty('Not found',
      'This practitioner isn’t available — they may not be approved, or the link is wrong.');
    return;
  }
  const photo = p.photo_path
    ? `<img class="coach-photo-lg" src="${esc(p.photo_path)}" alt="${esc(p.name)}">`
    : '';
  const tags = (p.specialties || []).map((s) => `<span class="topic">${esc(s)}</span>`).join('');
  const langs = (p.languages || []).join(', ');
  const price = centsToPrice(p.consultation_price_cents);
  $('coach-body').innerHTML = `<div style="display:flex;gap:1rem;flex-wrap:wrap">`
    + photo
    + `<div class="grow"><h3 style="margin:0 0 .3rem">${esc(p.name)}</h3>`
    + `<div class="topics" style="margin-bottom:.5rem">${tags}</div>`
    + `<div class="meta muted small">`
    + [p.years_experience ? esc(p.years_experience) + ' yrs experience' : '',
       langs ? 'Speaks ' + esc(langs) : '',
       price ? esc(price) + ' / consult' : '']
      .filter(Boolean).join(' · ')
    + `</div></div></div>`
    + `<div class="vine" aria-hidden="true"><span class="leaf soft"></span></div>`
    + `<p style="white-space:pre-wrap;line-height:1.7">${esc(p.bio || '')}</p>`;
  $('contact-panel').hidden = false;
  // Only Pro practitioners can accept clients (POST /api/clients 400s
  // otherwise) — showing this CTA for Basic practitioners let a visitor
  // fill out the whole form before hitting a failure (specs/v2/13-known-
  // issues.md H2).
  if (p.plan === 'pro') {
    $('signup-panel').hidden = false;
    $('become-client-link').href = '/signup?practitioner_id=' + encodeURIComponent(p.id);
  }
}

$('c-send').onclick = async () => {
  const name = $('c-name').value.trim();
  const email = $('c-email').value.trim();
  const message = $('c-message').value.trim();
  if (!name || !email || !message) { toast('Fill in your name, email and message', 'bad'); return; }
  $('c-send').disabled = true;
  try {
    await api(`/practitioners/${encodeURIComponent(id)}/contact`, json('POST', {
      name, email, message,
    }));
    toast('Message sent');
    $('c-name').value = ''; $('c-email').value = ''; $('c-message').value = '';
  } catch (e) {
    toast(e.message, 'bad');
  }
  $('c-send').disabled = false;
};

load();
adaptPublicAuthLinks();
</script>
</div>
</div>
</body>
</html>
